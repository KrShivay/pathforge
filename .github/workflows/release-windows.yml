name: Release Windows application

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Signed Windows installers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up MSVC Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Import code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD repository secrets are required for a signed release."
          }
          New-Item -ItemType Directory -Path certificate | Out-Null
          Set-Content -Path certificate/certificate.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/certificate.txt certificate/certificate.pfx | Out-Host
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "The Windows signing certificate could not be imported." }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed NSIS and MSI installers
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL repository secret is required for a signed release."
          }
          $config = '{"bundle":{"windows":{"certificateThumbprint":"' + $env:WINDOWS_CERTIFICATE_THUMBPRINT + '","digestAlgorithm":"sha256","timestampUrl":"' + $env:WINDOWS_TIMESTAMP_URL + '"}}}'
          npm run tauri build -- --ci --bundles nsis,msi --config $config

      - name: Upload signed installers
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: PathForge-${{ github.ref_name }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
